}

tasks.register('packageNativePlatformLayout') {
    group = 'release'
    description = 'Packages the Native Platform loader/runtime layout without product, modpack, or module content.'

    outputs.dir nativePlatformPackageOutput

    doLast {
        def outputRoot = file(nativePlatformPackageOutput.get())
        delete outputRoot
        outputRoot.mkdirs()

        def generatedAt = new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX")
        def writeJson = { String relativePath, Map payload ->
            def target = new File(outputRoot, relativePath)
            target.parentFile?.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) + System.lineSeparator()
        }

        writeJson('echo-native-platform-package.json', [
                schemaVersion          : 'echo.native.platform_package.v1',
                id                     : 'echo-native-platform',
                name                   : 'ECHO Native Platform',
                kind                   : 'loader_runtime',
                version                : '1.0.0-RC1',
                releaseLine            : '1.0.0-RC1',
                generatedAt            : generatedAt,
                containsModpack        : false,
                containsPackProfile    : false,
                containsProductModules : false,
                moduleCount            : 0,
                moduleDirectoryIncluded: false,
                packagedPackFiles      : [],
                launcherArtifacts      : [
                        nativeLoader: 'native-loader-1.0.0.jar'
                ],
                releaseIndex           : [
                        productId : 'echo-native-platform',
                        channel   : 'beta',
                        sourceRepo: 'knoxhack/ECHO-Native-Platform',
                        releaseTag: 'v1.0.0-RC1'
                ],
                loaderTheme            : [
                        defaultThemeId     : 'echo_native:loader_blue_console',
                        defaultThemeMode   : 'loader_default',
                        themeCoreDependency: 'optional-runtime-discovered'
                ]
        ])
        writeJson('runtime/native-loader-runtime.json', [
                schemaVersion          : 'echo.native.loader_runtime.v1',
                runtimeId              : 'echo-native-loader',
                version                : '1.0.0-RC1',
                owner                  : 'ECHO Native Platform',
                generatedAt            : generatedAt,
                zeroModuleStartup      : true,
                requiresPackProfile    : false,
                acceptsExternalPack    : true,
                builtInTheme           : 'echo_native:loader_blue_console',
                forbiddenPackFiles     : [
                        'echo.pack.json',
                        'echo-native-product-package.json',
                        'modules/'
                ],
                handoff                : [
                        packContentOwner: 'pack release',
                        launcherSource  : 'Release Index product echo-native-platform'
                ]
        ])
    }
}

