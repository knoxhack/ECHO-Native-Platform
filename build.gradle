tasks.register('packageNativeAllBridgeableModuleArtifacts') {
    group = 'verification'
    description = 'Packages every bridgeable native module class/resource output into deterministic Native Loader artifacts.'
    dependsOn 'prepareNativeAllBridgeableModuleLoadStateClasses'

    def artifactDirectoryProvider = layout.buildDirectory.dir('native-all-bridgeable-module-artifacts/modules')
    outputs.dir artifactDirectoryProvider
    outputs.upToDateWhen { false }
    onlyIf { echoModulesGradleAvailable() }

    doLast {
        def artifactDirectory = artifactDirectoryProvider.get().asFile
        delete artifactDirectory
        artifactDirectory.mkdirs()

        nativeAllBridgeableAuditModules.each { module ->
            def moduleId = String.valueOf(module.moduleId)
            def directory = String.valueOf(module.directory).replace('\\', '/')
            def sourceRoot = new File(echoModulesRepoRoot.get(), directory)
            def buildDirectoryName = new File(directory).name
            def classOutputCandidates = [
                    new File(sourceRoot, 'build/classes/java/main'),
                    new File(echoRootGradleBuildDirectory, "${buildDirectoryName}/classes/java/main")
            ]
            def resourceOutputCandidates = [
                    new File(sourceRoot, 'build/resources/main'),
                    new File(echoRootGradleBuildDirectory, "${buildDirectoryName}/resources/main")
            ]
            def classesDir = classOutputCandidates.find { it.isDirectory() }
            def resourcesDir = resourceOutputCandidates.find { it.isDirectory() }
            if (classesDir == null) {
                throw new GradleException("Missing native module classes for ${moduleId}; checked ${classOutputCandidates}")
            }
            def artifact = new File(artifactDirectory, "${moduleId}.jar")
            ant.jar(destfile: artifact) {
                fileset(dir: classesDir)
                if (resourcesDir != null) {
                    fileset(dir: resourcesDir)
                }
            }
        }
    }
}

