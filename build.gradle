tasks.register('writeNativeAgent4RegistryContentSmokeState') {
    group = 'verification'
    description = 'Writes durable Agent 4 registry content smoke availability state, including skipped-input reasons.'
    doLast {
        def report = layout.buildDirectory.file('agent4/registry-content/native-agent4-registry-content-state.json').get().asFile
        report.parentFile.mkdirs()
        def missingInputs = []
        if (!echoAgent4RegistryContractReport.isFile()) {
            missingInputs.add(echoAgent4RegistryContractReport.absolutePath)
        }
        if (!echoAgent4ResourceIndexReport.isFile()) {
            missingInputs.add(echoAgent4ResourceIndexReport.absolutePath)
        }
        def resolutionReport = new File(echoRepoRoot, 'reports/echo/assets/native-runtime-resolution-java.json')
        def status = missingInputs.isEmpty() && resolutionReport.isFile() ? 'PASS' : (missingInputs.isEmpty() ? 'READY' : 'SKIPPED')
        def blockers = missingInputs.collect { "missing required Agent 4 registry smoke input: ${it}" }
        if (missingInputs.isEmpty() && !resolutionReport.isFile()) {
            blockers.add("missing Native registry runtime resolution report: ${resolutionReport.absolutePath}")
        }
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                schema          : 'echo.native.agent4.registry_content_smoke_state.v1',
                generatedAt     : '1970-01-01T00:00:00Z',
                status          : status,
                runtime         : 'echo_native',
                moduleIds       : ['echoagent4', 'echoassetcore', 'echocontentcore'],
                featureBuckets  : ['blocks', 'items', 'recipes', 'loot', 'worldgen', 'audio'],
                trustedMutations: status == 'PASS'
                        ? ['Native Agent 4 Java registry content smoke resolved audited registry/resource inputs and materialized runtime resources']
                        : (missingInputs.isEmpty() ? ['external registry/resource audits available for Java host smoke'] : []),
                visibleRoutes   : [],
                saveEvidence    : status == 'PASS' ? ['native-runtime-resolution-java.json written after registry content host resolution'] : [],
                networkEvidence : [],
                blockers        : blockers
        ]))
        report.text = json + System.lineSeparator()
    }
}

tasks.named('runNativeAgent4RegistryContentSmoke') {
