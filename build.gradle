tasks.register('runNativeTransformPolicy', JavaExec) {
    group = 'verification'
    description = 'Prints Native Loader transform compatibility policy decisions without report/planner inputs.'
    dependsOn ':echo-native-cli:classes'
    classpath = project(':echo-native-cli').sourceSets.main.runtimeClasspath
    mainClass = 'dev.echo.nativeplatform.cli.EchoNativeCli'
    workingDir = rootProject.projectDir
    def fixture = providers.gradleProperty('echoNativeFixture')
            .orElse(providers.environmentVariable('ECHO_NATIVE_FIXTURE'))
    args 'native', 'transform-policy'
    doFirst {
        if (!fixture.isPresent()) {
            throw new GradleException('Set -PechoNativeFixture=<fixture-or-product-profile-root> or ECHO_NATIVE_FIXTURE before running runNativeTransformPolicy.')
        }
        args fixture.get()
    }
}

