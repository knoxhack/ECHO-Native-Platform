tasks.register('packagePublicAlphaRelease') {
    group = 'release'
    description = 'Compatibility alias that stages Native Platform RC1 release-candidate assets under build/public-alpha.'
    dependsOn ':echo-native-loader:jar'
    dependsOn 'packageNativePlatformLayout'

    doLast {
        def outDir = file("${buildDir}/public-alpha")
        delete outDir
        outDir.mkdirs()

        def writeJson = { String name, Map payload ->
            new File(outDir, name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    schemaVersion: 'echo.native_rc.generated_report.v1',
                    releaseLine  : '1.0.0-RC1',
                    generatedAt   : new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX"),
                    repository    : 'ECHO-Native-Platform'
            ] + payload)) + System.lineSeparator()
        }
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString()
        }
        def releaseAssetUrl = { String fileName ->
            "https://github.com/knoxhack/ECHO-Native-Platform/releases/download/v1.0.0-RC1/${fileName}"
        }
        def gitCommit = {
            try {
                def process = new ProcessBuilder('git', 'rev-parse', 'HEAD')
                        .directory(rootProject.projectDir)
                        .redirectErrorStream(true)
                        .start()
                def value = process.inputStream.getText('UTF-8').trim()
                return process.waitFor() == 0 && !value.isEmpty() ? value : 'unknown'
            } catch (Exception ignored) {
                return 'unknown'
            }
        }()

        def platformLayout = file(nativePlatformPackageOutput.get())
        if (!platformLayout.isDirectory()) {
            throw new GradleException("Cannot stage Native Platform RC1 runtime zip; missing Native platform layout: ${platformLayout}. Run packageNativePlatformLayout first.")
        }
        def platformArchive = new File(outDir, 'echo-native-platform-1.0.0-RC1.zip')
        ant.zip(destfile: platformArchive) {
            fileset(dir: platformLayout)
        }
        def forbiddenPlatformEntries = []
        def zip = new java.util.zip.ZipFile(platformArchive)
        try {
            zip.entries().each { entry ->
                def entryName = entry.name.replace('\\', '/')
                def normalized = entryName.toLowerCase(java.util.Locale.ROOT)
                if (normalized == 'echo.pack.json'
                        || normalized.endsWith('/echo.pack.json')
                        || normalized == 'echo-native-product-package.json'
                        || normalized.endsWith('/echo-native-product-package.json')
                        || normalized.startsWith('modules/')
                        || normalized.contains('/modules/')
                        || normalized.endsWith('.jar')
                        || normalized.contains('ashfall')) {
                    forbiddenPlatformEntries.add(entryName)
                }
            }
        } finally {
            zip.close()
        }
        if (!forbiddenPlatformEntries.isEmpty()) {
            throw new GradleException("Native Platform RC1 archive must be loader/runtime-only. Forbidden entries: ${forbiddenPlatformEntries.join(', ')}")
        }

        def sourceTruth = file('docs/echo/native/README.md')
        if (sourceTruth.isFile()) {
            copy {
                from sourceTruth
                into outDir
                rename { 'native-addon-source-truth.md' }
            }
        }

        def nativeLoaderJar = project(':echo-native-loader').tasks.named('jar').get().archiveFile.get().asFile
        if (!nativeLoaderJar.isFile()) {
            throw new GradleException("Cannot stage Native Loader RC library; missing ${nativeLoaderJar}.")
        }
        copy {
            from nativeLoaderJar
            into outDir
            rename { 'native-loader-1.0.0.jar' }
        }

        writeJson('native-live-proof-gate.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: 'Native Platform RC1 loader/runtime package was staged without product, modpack, or module content; promote only after workflow-built provenance and install smoke evidence exist.'
        ])
        writeJson('native-module-inventory.json', [
                status     : 'PASS_WITH_WARNINGS',
                modulesRoot: 'not-packaged-in-native-platform-release',
                summary    : 'Native Platform release assets intentionally exclude pack modules. Pack modules must ship from their owning pack release.'
        ])
        writeJson('plan3-dependency-vulnerability-scan.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: 'RC1 dependency evidence is staged; run external vulnerability attestations before stable release.'
        ])
        writeJson('plan3-final-qa.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: 'RC1 QA gate is staged as prerelease evidence.'
        ])
        writeJson('plan3-release-prep.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: 'RC1 release prep is staged. Stable release remains blocked until binaries are signed or attested.'
        ])

        def assetFiles = outDir.listFiles()
                .findAll { it.isFile() && it.name != 'checksums.txt' && it.name != 'echo-release.json' }
                .sort { it.name }
        def releaseArtifacts = assetFiles.collectEntries { file ->
            [(file.name.replaceAll('[^A-Za-z0-9]+(.)') { all, c -> c.toUpperCase() }
                    .replaceAll('^[^A-Za-z0-9]+', '')
                    .uncapitalize()): [
                    file  : file.name,
                    url   : releaseAssetUrl(file.name),
                    sha256: sha256(file),
                    size  : file.length()
            ]]
        }
        new File(outDir, 'echo-release.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                schemaVersion   : 'echo.release.index.entry.v1',
                id              : 'echo-native-platform',
                kind            : 'runtime',
                version         : '1.0.0-RC1',
                channel         : 'beta',
                publisher       : 'knoxhack',
                sourceRepo      : 'knoxhack/ECHO-Native-Platform',
                releaseTag      : 'v1.0.0-RC1',
                commitSha       : gitCommit,
                trust           : 'source-linked',
                validation      : 'warning',
                validationReason: 'RC1 loader/runtime assets were staged from the Native Platform Gradle release task without product or modpack content; promote only after GitHub upload/download-back, attestation, launcher handoff, rollback, and gameplay evidence are current.',
                artifacts       : releaseArtifacts,
                dependencies    : [],
                compatibility   : ['native-loader-runtime'],
                provenance      : [
                        status                 : 'local-rc1-built',
                        nativePlatformCommitSha: gitCommit,
                        buildCommand           : '.\\gradlew.bat runNativeLoaderClientEntrypointGate packageNativePlatformLayout packagePublicAlphaRelease --no-daemon --no-parallel --max-workers=1',
                        artifactPath           : platformArchive.absolutePath.replace('\\', '/'),
                        nativeLoaderPath       : new File(outDir, 'native-loader-1.0.0.jar').absolutePath.replace('\\', '/'),
                        releaseAssetGeneratedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX"),
                        attestation            : [
                                status: 'not-attested',
                                reason: 'Local RC1 assets have not been signed or attested yet.'
                        ]
                ],
                stableReleaseBlockedUntil: [
                        'GitHub v1.0.0-RC1 assets are uploaded and checksum/download-smoked',
                        'workflow provenance, signing, or attestation policy is satisfied',
                        'launcher install, rollback, and diagnostics smoke evidence are attached',
                        'pack gameplay evidence is real-run and green',
                        'all stable-target catalog metadata is approved rather than warning or blocked'
                ]
        ])) + System.lineSeparator()

        def lines = outDir.listFiles()
                .findAll { it.isFile() && it.name != 'checksums.txt' }
                .sort { it.name }
                .collect { file ->
                    "${sha256(file)}  ${file.name}"
                }
        new File(outDir, 'checksums.txt').text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

