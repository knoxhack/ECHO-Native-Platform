tasks.register('prepareNativeAgent4RegistryAudit') {
    group = 'verification'
    description = 'Generates fresh Agent 4 registry/data/assets audit reports for the native registry smoke.'
    mustRunAfter 'verifyNativeReportSnapshots'
    doLast {
        def auditScript = new File(rootProject.projectDir, 'tools/echo_agent4_registry_parity.py')
        if (!auditScript.isFile()) {
            def standaloneAgent4Dir = new File(echoRepoRoot, 'ECHO-Standalone-Runtime/build/tmp/agent4-registry-content')
            def fallbackRegistryReport = new File(standaloneAgent4Dir, 'adaptercore-registry-contracts.json')
            def fallbackResourceIndexReport = new File(standaloneAgent4Dir, 'all-addon-resource-index.json')
            if (fallbackRegistryReport.isFile() && fallbackResourceIndexReport.isFile()) {
                echoAgent4RegistryContractReport.parentFile.mkdirs()
                copy {
                    from fallbackRegistryReport
                    into echoAgent4RegistryContractReport.parentFile
                    rename { echoAgent4RegistryContractReport.name }
                }
                copy {
                    from fallbackResourceIndexReport
                    into echoAgent4ResourceIndexReport.parentFile
                    rename { echoAgent4ResourceIndexReport.name }
                }
                logger.lifecycle("Agent 4 registry parity script not present; copied Standalone generated registry/resource audit inputs into ${echoAgent4RegistryContractReport.parentFile}.")
            } else {
                logger.lifecycle('Agent 4 registry parity script not present and no generated Standalone Agent 4 inputs were found; Native registry content smoke will use its skipped-input state.')
            }
            return
        }
        exec {
            workingDir = rootProject.projectDir
            commandLine echoPythonExecutable,
                    auditScript.absolutePath,
                    '--root',
                    echoRepoRoot.absolutePath,
                    '--audit-only'
        }
    }
}

