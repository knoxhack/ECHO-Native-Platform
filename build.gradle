plugins {
    id 'java-library'
}

def publicNativeSdkProjects = [
        'echo-native-contracts',
        'echo-native-testkit',
] as Set

allprojects {
    group = 'dev.echo.nativeplatform'
    version = '1.0.0-RC1'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    if (project.name in publicNativeSdkProjects) {
        apply plugin: 'maven-publish'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        tasks.withType(Javadoc).configureEach {
            options.addStringOption('Xdoclint:none', '-quiet')
        }

        if (project.name == 'echo-native-testkit') {
            tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
                if (name == 'generateMetadataFileForMavenJavaPublication') {
                    enabled = false
                }
            }
        }

        publishing {
            publications {
                register('mavenJava', MavenPublication) {
                    from components.java
                    groupId = 'dev.echo.native'
                    artifactId = project.name
                    version = project.version
                    if (project.name == 'echo-native-testkit') {
                        pom.withXml {
                            def dependenciesNode = asNode().dependencies
                            dependenciesNode?.dependency?.findAll { dependencyNode ->
                                dependencyNode.groupId.text() == 'dev.echo.nativeplatform'
                            }?.each { dependencyNode ->
                                dependenciesNode[0].remove(dependencyNode)
                            }
                        }
                    }
                }
            }
        }
    }

    if (project.name == 'echo-native-bootstrap-api') {
        sourceSets.named('main') {
            java.exclude '**/*Smoke*.java'
            java.exclude '**/*Harness*.java'
            java.exclude '**/*Acceptance.java'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.incremental = false
    }
}

