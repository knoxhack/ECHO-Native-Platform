tasks.register('verifyReleaseIndexProductRouting', Exec) {
    group = 'verification'
    description = 'Verifies the Native Platform runtime update route resolves through the canonical Release Index product entry.'
    workingDir = rootProject.projectDir
    executable = 'node'
    args 'scripts/verify-release-index-product.mjs'
    doFirst {
        def releaseIndexRoot = echoReleaseIndexRoot.get().trim()
        if (!releaseIndexRoot.isEmpty()) {
            environment 'ECHO_RELEASE_INDEX_ROOT', releaseIndexRoot
        }
        if (echoReleaseIndexStrict.get().toBoolean()) {
            args '--strict'
        }
        if (echoReleaseIndexCheckUrls.get().toBoolean()) {
            args '--check-urls'
        }
    }
}

tasks.register('prepareNativeProductModuleArtifacts', Exec) {
    group = 'release'
    description = 'Builds source workspace module artifacts before Native Loader product packaging.'
    onlyIf { echoModulesGradleAvailable() }
    doFirst {
        workingDir = echoModulesRepoRoot.get()
        def gradleExecutable = echoModulesGradleExecutable()
        commandLine gradleExecutable.absolutePath,
                'validateReleaseArtifacts',
                "-PechoAddonSet=${nativeProductAddonSet.get()}",
                '--no-configuration-cache',
                '--no-problems-report',
                "--max-workers=${nativeProductPrepareMaxWorkers.get()}"
