tasks.register('packageNativeProductLayout', JavaExec) {
    group = 'release'
    description = 'Packages Native Loader product modules into a release layout with explicit artifact classpaths.'
    onlyIf { echoModulesGradleAvailable() }
    dependsOn ':echo-native-product-launcher:classes'
    dependsOn nativeProductLauncherRuntimeJarTasks
    dependsOn tasks.named('prepareNativeProductModuleArtifacts')
    classpath = nativeProductLauncherRuntimeClasspath()
    mainClass = 'dev.echo.nativeplatform.product.EchoNativeProductLauncherMain'
