def nativeAllBridgeableAuditModules = []
def nativeAllBridgeableModuleProjectPaths = []
if (echoNativeCoreModuleAuditReport.isFile()) {
    def audit = new groovy.json.JsonSlurper().parse(echoNativeCoreModuleAuditReport)
    def auditModules = audit.modules instanceof List ? audit.modules : []
    def modulesById = auditModules.collectEntries { module ->
        [(String.valueOf(module.moduleId)): module]
    }
    def selectedModules = new LinkedHashMap<String, Object>()
    Closure includeWithRequiredDependencies
    includeWithRequiredDependencies = { module ->
        if (module == null) {
            return
        }
        def moduleId = String.valueOf(module.moduleId)
        if (selectedModules.containsKey(moduleId)) {
            return
        }
        selectedModules[moduleId] = module
        if (module.requires instanceof List) {
            module.requires.each { requiredModuleId ->
                includeWithRequiredDependencies(modulesById[String.valueOf(requiredModuleId)])
            }
        }
    }
    auditModules
            .findAll { it.nativeIntegrationStatus == 'LEGACY_ADAPTER_BRIDGEABLE' }
            .each { includeWithRequiredDependencies(it) }
    nativeAllBridgeableAuditModules = selectedModules.values()
            .findAll { it.hasBuildGradle }
            .sort { String.valueOf(it.moduleId) }
    nativeAllBridgeableModuleProjectPaths = nativeAllBridgeableAuditModules
            .collect { ':' + new File(String.valueOf(it.directory).replace('\\', '/')).name }
            .unique()
            .sort()
}

