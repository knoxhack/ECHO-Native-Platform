tasks.register('echoPackageNativeAddon', Zip) {
    group = 'build'
    description = 'Packages the sample Native Loader proof add-on as a .echo-addon artifact.'
    dependsOn 'jarNativeLoaderProofModule'
    archiveFileName = 'echoashfallnativeproof.echo-addon'
    destinationDirectory = layout.buildDirectory.dir('echo-native/addons')
    from('fixtures/native-loader-sample/modules/echoashfallnativeproof/META-INF/echo.mod.json')
    from('fixtures/native-loader-sample/modules/echoashfallnativeproof/echo-addon-package.json')
    from(tasks.named('jarNativeLoaderProofModule').flatMap { it.archiveFile }) {
        rename { 'addon.jar' }
    }
    into('assets') {
        from('fixtures/native-loader-sample/modules/echoashfallnativeproof/assets')
    }
    into('data') {
        from('fixtures/native-loader-sample/modules/echoashfallnativeproof/data')
    }
}

