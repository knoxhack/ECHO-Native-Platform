tasks.register('packageNativeLoaderClientLibrary', Jar) {
    group = 'release'
    description = 'Builds the launcher-facing Native Loader client library with bootstrap handoff classes.'
    dependsOn ':echo-native-contracts:classes'
    dependsOn ':echo-native-diagnostics:classes'
    dependsOn ':echo-native-packos:classes'
    dependsOn ':echo-native-loader:classes'
    dependsOn ':echo-native-bootstrap-api:classes'
    archiveFileName = nativeLoaderClientLibraryName
    destinationDirectory = layout.buildDirectory.dir('native-loader-client-library')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':echo-native-contracts').sourceSets.main.output)
    from(project(':echo-native-diagnostics').sourceSets.main.output)
    from(project(':echo-native-packos').sourceSets.main.output)
    from(project(':echo-native-loader').sourceSets.main.output) {
        exclude 'com/mojang/logging/**'
        exclude 'org/slf4j/**'
    }
    from(project(':echo-native-bootstrap-api').sourceSets.main.output)
    manifest {
        attributes(
                'Main-Class': 'com.echo.NativeLoaderClient',
                'Implementation-Title': 'ECHO Native Loader',
                'Implementation-Version': nativeLoaderReleaseVersion
        )
    }
}

tasks.register('verifyNativeLoaderClientLibrary') {
    group = 'verification'
    description = 'Verifies the launcher-facing Native Loader client library contains bootstrap handoff classes.'
    dependsOn 'packageNativeLoaderClientLibrary'
    doLast {
        def library = tasks.named('packageNativeLoaderClientLibrary').get().archiveFile.get().asFile
        if (!library.isFile()) {
            throw new GradleException("Native Loader client library is missing: ${library}.")
        }
        def requiredEntries = [
                'com/echo/NativeLoaderClient.class',
                'dev/echo/nativeplatform/bootstrap/EchoNativeBootstrapMain.class',
                'dev/echo/nativeplatform/bootstrap/EchoNativeBootstrapEntrypointRunner.class',
                'dev/echo/nativeplatform/bootstrap/EchoNativeBootstrapActivationRunner.class',
                'dev/echo/nativeplatform/loader/NativeLoaderCoreServiceRegistrar.class'
        ]
        def forbiddenEntries = [
                'com/mojang/logging/LogUtils.class',
                'org/slf4j/LoggerFactory.class',
                'org/slf4j/Logger.class',
                'org/slf4j/Marker.class'
        ]
        def missingEntries = []
        def packagedForbiddenEntries = []
        def jar = new java.util.jar.JarFile(library)
        try {
            requiredEntries.each { entryName ->
                if (jar.getEntry(entryName) == null) missingEntries.add(entryName)
            }
            forbiddenEntries.each { entryName ->
                if (jar.getEntry(entryName) != null) packagedForbiddenEntries.add(entryName)
            }
        } finally {
            jar.close()
        }
        if (!missingEntries.isEmpty()) {
            throw new GradleException("Native Loader client library is missing required bootstrap classes: ${missingEntries.join(', ')}")
        }
        if (!packagedForbiddenEntries.isEmpty()) {
            throw new GradleException("Native Loader client library must not package Minecraft logging compatibility stubs: ${packagedForbiddenEntries.join(', ')}")
        }
    }
}

