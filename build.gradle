def echoPythonExecutable = providers.environmentVariable('PYTHON').orElse('python').get()
def echoRootGradleBuildDirectory = new File(System.getProperty('user.home'), 'AppData/Local/EchoGradleBuild/Echo')
def echoNativeCoreModuleAuditReport = new File(echoModulesRepoRoot.get(), 'reports/echo-native/core-module-integration-audit.json')
def echoAgent4RegistryContractReport = new File(echoRepoRoot, 'reports/echo/assets/adaptercore-registry-contracts.json')
def echoAgent4ResourceIndexReport = new File(echoRepoRoot, 'reports/echo/assets/all-addon-resource-index.json')
def nativeCoreModuleLoadStateProjectPaths = [
        ':echocore',
        ':echoplatformcore',
        ':echoadaptercore',
        ':echopackcore',
        ':echoschemacore',
        ':echovalidationcore',
        ':echometadatacore',
        ':echomodulegraph',
        ':echohealthcore',
        ':echoagentcore',
        ':echobridgecore',
        ':echocontentcore',
        ':echoassetcore',
