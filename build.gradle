        qa {
            java.srcDir 'src/qa/java'
            compileClasspath += sourceSets.main.output +
                    sourceSets.main.compileClasspath +
                    sourceSets.main.runtimeClasspath +
                    project(':echo-native-contracts').sourceSets.main.output +
                    project(':echo-native-loader').sourceSets.main.output
