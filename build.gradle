tasks.register('packagePublicAlphaRelease') {
    group = 'release'
    description = 'Stages Native Platform release assets under build/public-alpha.'
    dependsOn 'packageNativeLoaderClientLibrary'
    dependsOn 'verifyNativeLoaderClientLibrary'
    dependsOn 'packageNativePlatformLayout'

    doLast {
        def outDir = file("${buildDir}/public-alpha")
        delete outDir
        outDir.mkdirs()

        def writeJson = { String name, Map payload ->
            new File(outDir, name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    schemaVersion: 'echo.native_rc.generated_report.v1',
                    releaseLine  : nativeLoaderReleaseTag,
                    generatedAt   : new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX"),
                    repository    : 'ECHO-Native-Platform'
            ] + payload)) + System.lineSeparator()
        }
        def sha256 = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().encodeHex().toString()
        }
        def releaseAssetUrl = { String fileName ->
            "https://github.com/knoxhack/ECHO-Native-Platform/releases/download/${nativeLoaderReleaseTag}/${fileName}"
        }
        def gitCommit = {
            try {
                def process = new ProcessBuilder('git', 'rev-parse', 'HEAD')
                        .directory(rootProject.projectDir)
                        .redirectErrorStream(true)
                        .start()
                def value = process.inputStream.getText('UTF-8').trim()
                return process.waitFor() == 0 && !value.isEmpty() ? value : 'unknown'
            } catch (Exception ignored) {
                return 'unknown'
            }
        }()

        def platformLayout = file(nativePlatformPackageOutput.get())
        if (!platformLayout.isDirectory()) {
            throw new GradleException("Cannot stage Native Platform runtime zip; missing Native platform layout: ${platformLayout}. Run packageNativePlatformLayout first.")
        }
        def platformArchive = new File(outDir, nativePlatformReleaseArchiveName)
        ant.zip(destfile: platformArchive) {
            fileset(dir: platformLayout)
        }
        def forbiddenPlatformEntries = []
        def zip = new java.util.zip.ZipFile(platformArchive)
        try {
            zip.entries().each { entry ->
                def entryName = entry.name.replace('\\', '/')
                def normalized = entryName.toLowerCase(java.util.Locale.ROOT)
                if (normalized == 'echo.pack.json'
                        || normalized.endsWith('/echo.pack.json')
                        || normalized == 'echo-native-product-package.json'
                        || normalized.endsWith('/echo-native-product-package.json')
                        || normalized.startsWith('modules/')
                        || normalized.contains('/modules/')
                        || normalized.endsWith('.jar')
                        || normalized.contains('ashfall')) {
                    forbiddenPlatformEntries.add(entryName)
                }
            }
        } finally {
            zip.close()
        }
        if (!forbiddenPlatformEntries.isEmpty()) {
            throw new GradleException("Native Platform archive must be loader/runtime-only. Forbidden entries: ${forbiddenPlatformEntries.join(', ')}")
        }

        def sourceTruth = file('docs/echo/native/README.md')
        if (sourceTruth.isFile()) {
            copy {
                from sourceTruth
                into outDir
                rename { 'native-addon-source-truth.md' }
            }
        }

        def nativeLoaderJar = tasks.named('packageNativeLoaderClientLibrary').get().archiveFile.get().asFile
        if (!nativeLoaderJar.isFile()) {
            throw new GradleException("Cannot stage Native Loader library; missing ${nativeLoaderJar}.")
        }
        def stagedNativeLoaderJar = new File(outDir, nativeLoaderClientLibraryName)
        copy {
            from nativeLoaderJar
            into outDir
            rename { nativeLoaderClientLibraryName }
        }
        if (!stagedNativeLoaderJar.isFile()) {
            throw new GradleException("Cannot verify staged Native Loader library; missing ${stagedNativeLoaderJar}.")
        }
        def requiredLoaderEntries = [
                'com/echo/NativeLoaderClient.class',
                'dev/echo/nativeplatform/bootstrap/EchoNativeBootstrapMain.class',
                'dev/echo/nativeplatform/bootstrap/EchoNativeBootstrapEntrypointRunner.class',
                'dev/echo/nativeplatform/bootstrap/EchoNativeBootstrapActivationRunner.class',
                'dev/echo/nativeplatform/loader/NativeLoaderCoreServiceRegistrar.class'
        ]
        def missingLoaderEntries = []
        def jar = new java.util.jar.JarFile(stagedNativeLoaderJar)
        try {
            requiredLoaderEntries.each { entryName ->
                if (jar.getEntry(entryName) == null) missingLoaderEntries.add(entryName)
            }
        } finally {
            jar.close()
        }
        if (!missingLoaderEntries.isEmpty()) {
            throw new GradleException("Native Loader direct jar is missing required entrypoint classes: ${missingLoaderEntries.join(', ')}")
        }

        writeJson('native-loader-direct-install.json', [
                schemaVersion          : 'echo.native.loader_direct_install.v1',
                artifactRole           : 'native-loader-library',
                id                     : 'echo-native-loader',
                name                   : 'ECHO Native Loader',
                version                : nativeLoaderReleaseVersion,
                releaseLine            : nativeLoaderReleaseTag,
                file                   : stagedNativeLoaderJar.name,
                url                    : releaseAssetUrl(stagedNativeLoaderJar.name),
                sha256                 : sha256(stagedNativeLoaderJar),
                size                   : stagedNativeLoaderJar.length(),
                manualInstall          : true,
                developerDirectDownload: true,
                launcherFacing         : false,
                moduleArtifact         : false,
                packContent            : false,
                expectedJava           : [
                        minimumMajorVersion: 25,
                        testedMajorVersion : 25
                ],
                minecraftLibrary       : [
                        name: "com.echo:native-loader:${nativeLoaderReleaseVersion}",
                        path: "com/echo/native-loader/${nativeLoaderReleaseVersion}/native-loader-${nativeLoaderReleaseVersion}.jar"
                ],
                mainClass              : 'com.echo.NativeLoaderClient',
                bootstrapMainClass     : 'dev.echo.nativeplatform.bootstrap.EchoNativeBootstrapMain',
                packContentOwner       : 'pack/module releases',
                modulePlacement        : [
                        nativeAddons: 'addons/',
                        note        : 'Native Platform release assets do not include pack modules. Download modules from pack or module releases.'
                ]
        ])

        writeJson('native-live-proof-gate.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: "Native Platform ${nativeLoaderReleaseTag} loader/runtime package was staged without product, modpack, or module content; promote only after workflow-built provenance and install smoke evidence exist."
        ])
        writeJson('native-module-inventory.json', [
                status     : 'PASS_WITH_WARNINGS',
                modulesRoot: 'not-packaged-in-native-platform-release',
                summary    : 'Native Platform release assets intentionally exclude pack modules. Pack modules must ship from their owning pack release.'
        ])
        writeJson('plan3-dependency-vulnerability-scan.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: "${nativeLoaderReleaseTag} dependency evidence is staged; run external vulnerability attestations before stable release."
        ])
        writeJson('plan3-final-qa.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: "${nativeLoaderReleaseTag} QA gate is staged as prerelease evidence."
        ])
        writeJson('plan3-release-prep.json', [
                status : 'PASS_WITH_WARNINGS',
                summary: "${nativeLoaderReleaseTag} release prep is staged. Stable release remains blocked until binaries are signed or attested."
        ])

        def assetFiles = outDir.listFiles()
                .findAll { it.isFile() && it.name != 'checksums.txt' && it.name != 'echo-release.json' }
                .sort { it.name }
        def releaseArtifacts = assetFiles.collectEntries { file ->
            def artifact = [
                    file  : file.name,
                    url   : releaseAssetUrl(file.name),
                    sha256: sha256(file),
                    size  : file.length()
            ]
            if (file.name == nativePlatformReleaseArchiveName) {
                artifact.artifactRole = 'native-platform-package'
                artifact.launcherFacing = true
                artifact.moduleArtifact = false
                artifact.packContent = false
            }
            if (file.name == nativeLoaderClientLibraryName) {
                artifact.artifactRole = 'native-loader-library'
                artifact.manualInstall = true
                artifact.developerDirectDownload = true
                artifact.launcherFacing = false
                artifact.moduleArtifact = false
                artifact.packContent = false
            }
            if (file.name == 'native-loader-direct-install.json') {
                artifact.artifactRole = 'native-loader-direct-install-descriptor'
                artifact.manualInstall = true
                artifact.developerDirectDownload = true
                artifact.launcherFacing = false
                artifact.moduleArtifact = false
                artifact.packContent = false
            }
            [(file.name.replaceAll('[^A-Za-z0-9]+(.)') { all, c -> c.toUpperCase() }
                    .replaceAll('^[^A-Za-z0-9]+', '')
                    .uncapitalize()): artifact]
        }
        new File(outDir, 'echo-release.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                schemaVersion   : 'echo.release.index.entry.v1',
                id              : 'echo-native-platform',
                kind            : 'runtime',
                version         : nativeLoaderReleaseVersion,
                channel         : 'beta',
                publisher       : 'knoxhack',
                sourceRepo      : 'knoxhack/ECHO-Native-Platform',
                releaseTag      : nativeLoaderReleaseTag,
                commitSha       : gitCommit,
                trust           : 'source-linked',
                validation      : 'warning',
                validationReason: "${nativeLoaderReleaseTag} loader/runtime assets were staged from the Native Platform Gradle release task without product or modpack content; promote only after GitHub upload/download-back, attestation, launcher handoff, rollback, and gameplay evidence are current.",
                artifacts       : releaseArtifacts,
                dependencies    : [],
                compatibility   : ['native-loader-runtime'],
                provenance      : [
                        status                 : "local-${nativeLoaderReleaseTag}-built",
                        nativePlatformCommitSha: gitCommit,
                        buildCommand           : '.\\gradlew.bat runNativeLoaderClientEntrypointGate packageNativePlatformLayout packagePublicAlphaRelease --no-daemon --no-parallel --max-workers=1',
                        artifactPath           : platformArchive.absolutePath.replace('\\', '/'),
                        nativeLoaderPath       : stagedNativeLoaderJar.absolutePath.replace('\\', '/'),
                        releaseAssetGeneratedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ss.SSSXXX"),
                        attestation            : [
                                status: 'not-attested',
                                reason: "Local ${nativeLoaderReleaseTag} assets have not been signed or attested yet."
                        ]
                ],
                stableReleaseBlockedUntil: [
                        "GitHub ${nativeLoaderReleaseTag} assets are uploaded and checksum/download-smoked",
                        'workflow provenance, signing, or attestation policy is satisfied',
                        'launcher install, rollback, and diagnostics smoke evidence are attached',
                        'pack gameplay evidence is real-run and green',
                        'all stable-target catalog metadata is approved rather than warning or blocked'
                ]
        ])) + System.lineSeparator()

        def lines = outDir.listFiles()
                .findAll { it.isFile() && it.name != 'checksums.txt' }
                .sort { it.name }
                .collect { file ->
                    "${sha256(file)}  ${file.name}"
                }
        new File(outDir, 'checksums.txt').text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register('generateNativeStrictPlayEvidence', Exec) {
    group = 'verification'
    description = 'Aggregates Native Loader strict-play evidence sidecars into the canonical reports consumed by ECHO-Modules --strict-play.'
    dependsOn 'runNativeAllBridgeableModuleArtifactLoadStateSmoke'
    dependsOn 'runNativeAgent2ClientRouteOwnershipSmoke'
    dependsOn 'runNativeAgent5UiBridgeContractSmoke'
    dependsOn 'runNativeAllModuleCreativeTabVisibilitySmoke'
    dependsOn 'runNativeAgent4RegistryContentSmoke'
    dependsOn 'runNativeAgent4WorldStartupSmoke'
    dependsOn 'runNativeAgent9MachineRuntimeHostSmoke'
    dependsOn 'runNativeMutationTruthGate'
    workingDir = rootProject.projectDir
    executable = 'node'
    args 'scripts/generate-native-strict-play-evidence.mjs',
            '--modules-root', echoModulesRepoRoot.get().absolutePath
}

tasks.register('testGenerateNativeStrictPlayEvidence', Exec) {
    group = 'verification'
    description = 'Tests the Native strict-play evidence aggregation script.'
    workingDir = rootProject.projectDir
    executable = 'node'
    args 'scripts/test-generate-native-strict-play-evidence.mjs'
}
