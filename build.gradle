tasks.register('runPackagedNativeProductLauncher', JavaExec) {
    group = 'application'
    description = 'Packages Native Loader modules and launches the packaged product layout through the release gate by default.'
    onlyIf { echoModulesGradleAvailable() }
    dependsOn tasks.named('packageNativeProductLayout')
    dependsOn nativeProductLauncherRuntimeJarTasks
    dependsOn tasks.named('verifyReleaseIndexProductRouting')
    classpath = nativeProductLauncherRuntimeClasspath()
    mainClass = 'dev.echo.nativeplatform.product.EchoNativeProductLauncherMain'
    workingDir = rootProject.projectDir
    systemProperty 'echo.native.gradleBuildRoot', nativeProductGradleBuildRoot.get()
    doFirst {
        def launchArgs = [nativeProductPackageOutput.get()]
        def moduleOnly = providers.gradleProperty('echoNativeModuleOnly').map { it.toBoolean() }
                .orElse(providers.gradleProperty('echoNativeDev').map { it.toBoolean() })
                .orElse(false)
                .get()
        def releaseRequested = providers.gradleProperty('echoNativeRelease').map { it.toBoolean() }
                .orElse(providers.gradleProperty('echoNativeFullRelease').map { it.toBoolean() })
                .orElse(!moduleOnly)
                .get()
        def requireMutation = providers.gradleProperty('echoNativeRequireMutation').map { it.toBoolean() }
                .orElse(true)
                .get()
        def requireLiveRuntime = providers.gradleProperty('echoNativeRequireLiveRuntime').map { it.toBoolean() }
                .orElse(false)
                .get()

        if (releaseRequested) {
            launchArgs.add('--release')
        } else {
            launchArgs.add('--module-only')
        }
        if (!releaseRequested && requireMutation) {
            launchArgs.add('--require-mutation')
        }
        if (!releaseRequested && requireLiveRuntime) {
            launchArgs.add('--require-live-runtime')
        }
        setArgs(launchArgs)
    }
