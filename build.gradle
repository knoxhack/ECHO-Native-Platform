tasks.register('runNativeProductLauncher', JavaExec) {
    group = 'application'
    description = 'Runs the Native Loader product launcher against the ECHO workspace by default; use -PechoNativeRelease=true for release validation.'
    dependsOn ':echo-native-product-launcher:classes'
    classpath = nativeProductLauncherRuntimeClasspath()
    mainClass = 'dev.echo.nativeplatform.product.EchoNativeProductLauncherMain'
    workingDir = rootProject.projectDir
    def productRoot = providers.gradleProperty('echoNativeProductRoot')
            .orElse(providers.gradleProperty('echoNativeFixture'))
            .orElse(providers.environmentVariable('ECHO_NATIVE_PRODUCT_ROOT'))
            .orElse(providers.environmentVariable('ECHO_NATIVE_FIXTURE'))
            .orElse(rootProject.projectDir.parentFile.absolutePath)
    doFirst {
        def explicitRelease = providers.gradleProperty('echoNativeRelease').map { it.toBoolean() }
                .orElse(providers.gradleProperty('echoNativeFullRelease').map { it.toBoolean() })
                .orElse(false)
                .get()
        def moduleOnly = providers.gradleProperty('echoNativeModuleOnly').map { it.toBoolean() }
                .orElse(providers.gradleProperty('echoNativeDev').map { it.toBoolean() })
                .orElse(!explicitRelease)
                .get()
        def releaseRequested = explicitRelease && !moduleOnly
        args productRoot.get()
        if (releaseRequested) {
            args '--release'
        } else {
            args '--module-only'
        }
        if (!releaseRequested && providers.gradleProperty('echoNativeRequireMutation').map { it.toBoolean() }.orElse(false).get()) {
            args '--require-mutation'
        }
        if (!releaseRequested && providers.gradleProperty('echoNativeRequireLiveRuntime').map { it.toBoolean() }.orElse(false).get()) {
            args '--require-live-runtime'
        }
        if (providers.gradleProperty('echoNativeFullRelease').map { it.toBoolean() }.orElse(false).get()) {
            args '--full-release'
        }
    }
}

