name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ECHO-Native-Platform
      - uses: actions/checkout@v4
        with:
          repository: knoxhack/ECHO-Modules
          path: ECHO-Modules
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        working-directory: ECHO-Native-Platform
        run: .\gradlew.bat build --console=plain
