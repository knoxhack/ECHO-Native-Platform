name: Attest Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to attest.
        required: true
        default: v1.0.7

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rc-release-assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir rc-release-assets \
            --pattern '*'
          find rc-release-assets -maxdepth 1 -type f -print | sort

      - name: Attest release asset bytes
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: rc-release-assets/*
